[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "qml"
version = "0.0.1"
description = "A short description of the project."
authors = [
  { name = "Your name (or your organization/company/team)" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "ipython",
    "jupyterlab",
    "keras>=3.12.1",
    "loguru",
    "matplotlib",
    "notebook",
    "numpy",
    "pandas",
    "pip",
    "pylatexenc>=2.10",
    "python-dotenv",
    "qiskit>=2.3.1",
    "ruff",
    "scikit-learn",
    "seaborn>=0.13.2",
    "tensorflow>=2.21.0",
    "tqdm",
    "typer",
    "ucimlrepo>=0.0.7",
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["qml"]
include = ["pyproject.toml", "qml/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["qml"]
force-sort-within-sections = true

